services:
  veritas:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - veritas_audits:/app/.veritas
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
volumes:
  veritas_audits:
